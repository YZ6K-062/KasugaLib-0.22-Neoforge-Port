# =============================================================================
#  KasugaLib 0.22 — NeoForge 1.21.1 port
#
#  This file was missing from the working tree, which made a clean build fail at
#  build.gradle line 8:
#      Could not get unknown property 'mod_version' for root project ...
#  (Earlier builds only appeared to work because Gradle replayed a configuration
#  cache entry that had been produced while the file still existed.)
#
#  Values below are taken from the metadata of the last successful publication
#  (kasuga_lib-0.22.1-neoforge-create.pom / the generated
#  META-INF/neoforge.mods.toml inside the published jar) and from the upstream
#  repository D:\KasugaLib.
# =============================================================================

org.gradle.jvmargs=-Xmx4G -Dhttp.readTimeout\=300000 -Dhttp.connectionTimeout\=300000 -Dhttp.socketTimeout\=300000 -Dorg.gradle.internal.http.socketTimeout\=300000 -Dorg.gradle.internal.http.connectionTimeout\=300000 -Dorg.gradle.internal.http.readTimeout\=300000
org.gradle.daemon=false

# =========================
# mod version configuration
# =========================

minecraft_version=1.21.1

# base version; a "-create" suffix is appended when built with -Ptype=create
mod_version=0.22.1-neoforge

# internal/nightly/alpha/beta/rc/release
channel=release

# only works for alpha/beta/rc builds, the serial number
snapshot_serial=0

# internal builder code
internal_code=UNKN

# [kasugalib only] the repository type, normal or create
type=normal

# =========================
# mod metadata (META-INF/neoforge.mods.toml)
# =========================

mod_id=kasuga_lib
mod_name=KasugaLib
mod_group_id=kasuga.lib
# Upstream D:\KasugaLib\LICENSE is MIT (c) 2024 MegumiKasuga — see ./LICENSE
mod_license=MIT
mod_authors=KasugaLibTeam
mod_description=Kasuga Lib is a base mod aiming at simplify modding. (NeoForge 1.21.1 port)

# =========================
# loader / dependency ranges
# =========================

neo_version=21.1.250
neo_version_range=[21,)
loader_version_range=[4,)
minecraft_version_range=[1.21.1,1.22)

# =========================
# mappings
# =========================

parchment_minecraft_version=1.21.11
parchment_mappings_version=2025.12.20

# =========================
# dependency versions
#
# Only consumed when building the Create flavour (`-Ptype=create`), which is the
# flavour the Create-6.0 based mods in this workspace depend on
# (kasuga.lib:kasuga_lib:0.22.1-neoforge-create). Values mirror the working
# D:\KuaYue1.0 Neoforge Port build so both projects resolve the same artefacts.
# =========================

create_minecraft_version=1.21.1
# 6.0.8-169 is the newest published build of the 6.0.8 series (there is no plain "6.0.8")
create_version=6.0.8-169
ponder_version=1.0.66
# Create 6.0 split Flywheel out; the 1.21.1 coordinates are dev.engine-room.flywheel
flywheel_version=1.0.6
registrate_version=MC1.21-1.3.0+67
jei_version=19.21.0.247

