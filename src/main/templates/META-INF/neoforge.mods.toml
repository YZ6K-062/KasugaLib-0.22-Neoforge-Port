# NeoForge mods.toml for KasugaLib (1.21.1 port)
modLoader = "javafml"
loaderVersion = "${loader_version_range}"
license = "${mod_license}"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
credits = "KasugaLib Group"
authors = "${mod_authors}"
description = '''${mod_description}'''

# The original KasugaLib mixin config name is "kasuga.mixins.json" (generated by datagen).
[[mixins]]
config = "kasuga.mixins.json"

[[dependencies."${mod_id}"]]
modId = "neoforge"
type = "required"
versionRange = "${neo_version_range}"
ordering = "NONE"
side = "BOTH"

[[dependencies."${mod_id}"]]
modId = "minecraft"
type = "required"
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
